[project]
name = "neoprint"
version = "1.0.1b0"
description = "The artistic print for modern consoles."
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=14.0.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.29.0"]

[dependency-groups]
dev = [
    "argsense>=3.0.0",
    "catppuccin[pygments]>=2.5.0",
    "faker>=40.8.0; python_version >= '3.12'",
    "ipython>=9.17.0; python_version >= '3.12'",
    "lk-utils>=3.8.2; python_version >= '3.12'",
    # "loguru>=0.7.3",
    "objprint>=0.3.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
termshot = ["catppuccin[pygments]>=2.5.0"]

[project.urls]
homepage = "https://github.com/likianta/neoprint"

[tool.hatch.build.targets.wheel]
packages = ["neoprint"]

[tool.ruff]
ignore = ["E701"]
line-length = 80

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
force-single-line = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# [tool.ty.rules]
# invalid-type-form = "ignore"
# unresolved-attribute = "ignore"

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
url = "http://localhost:2131/"
explicit = true

